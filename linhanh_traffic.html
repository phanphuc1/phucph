<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline Lộ Trình Traffic - Linh Anh</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #141414;
            --gold-primary: #d4af37;
            --gold-light: #f7e089;
            --gold-dark: #a3821a;
            --text-light: #f5f5f5;
            --text-muted: #a0a0a0;
            --border-color: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

        header { text-align: center; margin-bottom: 50px; }
        header h1 { color: var(--gold-primary); font-size: 2.5rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; }
        header p { color: var(--text-muted); font-size: 1.1rem; }

        .chart-container {
            background-color: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 20px; margin-bottom: 50px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .timeline-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }

        .month-card {
            background: linear-gradient(145deg, var(--bg-card) 0%, #1a1a1a 100%);
            border: 1px solid var(--border-color); border-radius: 12px; padding: 20px;
            cursor: pointer; transition: transform 0.3s ease, border-color 0.3s ease;
            position: relative; overflow: hidden;
        }
        
        .month-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: var(--gold-primary); transform: scaleX(0); transform-origin: left; transition: transform 0.3s ease;
        }

        .month-card:hover { border-color: var(--gold-dark); box-shadow: 0 10px 30px rgba(212, 175, 55, 0.1); }
        .month-card:hover::before { transform: scaleX(1); }

        .month-title { color: var(--gold-primary); font-size: 1.4rem; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .total-sessions { background-color: rgba(212, 175, 55, 0.1); color: var(--gold-light); padding: 6px 12px; border-radius: 20px; font-size: 1.1rem; font-weight: 600; display: inline-block; margin-bottom: 15px; border: 1px solid rgba(212, 175, 55, 0.3); }

        .data-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--border-color); font-size: 0.9rem; }
        .data-item:last-child { border-bottom: none; }
        .group-name { font-weight: 600; color: var(--text-light); width: 60px; }
        .group-urls { color: var(--text-muted); flex: 1; text-align: right; }
        .group-sessions { color: var(--gold-light); font-weight: 600; text-align: right; width: 100px; }

        .action-hint {
            text-align: center; margin-top: 15px; font-size: 0.85rem; color: var(--gold-dark);
            text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
        }

        /* Modal / Table Section */
        #detailsModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--bg-card); width: 90%; max-width: 1000px; max-height: 85vh;
            border-radius: 12px; border: 1px solid var(--gold-dark);
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .modal-header {
            padding: 20px 30px; border-bottom: 1px solid var(--border-color); display: flex;
            justify-content: space-between; align-items: center; background: rgba(212, 175, 55, 0.1);
        }

        .modal-header h2 { color: var(--gold-primary); font-size: 1.6rem; }
        .close-btn { color: var(--text-light); font-size: 2rem; cursor: pointer; line-height: 1; }
        .close-btn:hover { color: var(--gold-primary); }

        .modal-body {
            padding: 0; overflow-y: auto; flex: 1;
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        thead { background: #1a1a1a; position: sticky; top: 0; z-index: 10; }
        th { padding: 15px 20px; color: var(--gold-light); font-weight: 600; font-size: 0.95rem; border-bottom: 1px solid var(--gold-dark); }
        td { padding: 15px 20px; font-size: 0.9rem; border-bottom: 1px solid var(--border-color); }
        tr:hover { background-color: rgba(255,255,255,0.03); }

        .tag-group {
            padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 700;
            background: rgba(212, 175, 55, 0.15); color: var(--gold-primary); border: 1px solid var(--gold-dark);
        }

        .cell-url { color: #88c0d0; text-decoration: none; word-break: break-all; }
        .cell-url:hover { text-decoration: underline; color: #8fbcbb; }
        .cell-keyword { color: var(--text-light); font-weight: 600; }
    </style>
</head>

                },
                scales: {
                    x: { grid: { color: '#222' }, ticks: { color: '#a0a0a0' } },
                    y: { grid: { color: '#222' }, ticks: { color: '#a0a0a0' } }
                }
            }
        });

        // Modal Logic
        const modal = document.getElementById('detailsModal');
        const tbody = document.getElementById('urlTableBody');
        const modalTitle = document.getElementById('modalTitle');

        function openModal(index) {
            const data = ROW_DATA[index];
            modalTitle.innerText = `Danh sách URL Cần Chạy - ${data.month}`;
            
            let html = '';
            data.urls_data.forEach((u, i) => {
                html += `
                    <tr>
                        <td style="text-align:center">${i + 1}</td>
                        <td><span class="tag-group">${u.group}</span></td>
                        <td class="cell-keyword">${u.keyword}</td>
                        <td><a href="${u.url}" target="_blank" class="cell-url">${u.url}</a></td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden'; // block scroll
        }

        function closeModal() {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
